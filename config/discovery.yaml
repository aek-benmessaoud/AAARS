# Discovery campaign configuration
# Seeds 0-9 used for threshold tuning

# Use first 10 seeds for discovery
num_runs: 10
base_seed: 0
seed_stride: 1000

# Reduced steps for faster discovery
max_steps: 3000

# Override AAARS parameters for grid search
aaars:
  window_size: 8
  w_temporal: [0.2, 0.3, 0.4, 0.5]
  w_spatial: [0.2, 0.3, 0.4]
  w_frequency: [0.2, 0.3, 0.4]
  ema_alpha: [0.05, 0.1, 0.2]
  base_alpha: [0.03, 0.05, 0.10]
  risk_lambda: [0.5, 1.0, 2.0]
